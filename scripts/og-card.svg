<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#35D0A5" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#35D0A5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#35D0A5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#35D0A5" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- ground -->
  <rect width="1200" height="630" fill="#171F29"/>

  <!-- faint instrument grid -->
  <g stroke="#EDF1F4" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- top accent hairline -->
  <rect x="0" y="0" width="1200" height="4" fill="#35D0A5"/>

  <!-- ============ RIGHT: logo mark (injected by build-og.mjs from src/lib/logo.mjs) ============ -->
  {{LOGO_MARK}}

  <!-- ============ LEFT: wordmark + thesis ============ -->
  <!-- brand lockup (injected by build-og.mjs from src/lib/logo.mjs) -->
  {{LOGO_H}}

  <!-- company statement (matches the site hero) -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="47" fill="#EDF1F4">
    <text x="78" y="190"><tspan font-style="italic" fill="#35D0A5">Qualiber</tspan> builds software and</text>
    <text x="78" y="250">tools that help teams <tspan font-style="italic" fill="#35D0A5">assess</tspan></text>
    <text x="78" y="310">the quality of applications</text>
    <text x="78" y="370">and AI systems, understand</text>
    <text x="78" y="430">the risks, and make</text>
    <text x="78" y="490"><tspan font-style="italic" fill="#35D0A5">informed decisions</tspan>.</text>
  </g>

  <!-- tagline -->
  <text x="80" y="548" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#66757F" letter-spacing="1.5">Instruments for quality that holds up.</text>

  <!-- url -->
  <text x="80" y="592" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#35D0A5" letter-spacing="1.5">qualiber.ai</text>
</svg>
